name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q -o addopts="-ra -q --strict-markers"

  tensorflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with TensorFlow extra
        run: python -m pip install -e ".[tensorflow]" pytest

      - name: Run TensorFlow/Keras tests
        run: >
          python -m pytest -q -o addopts="-ra -q --strict-markers"
          tests/test_keras_classifier_wrap_digits.py tests/test_keras_multi_input.py
          tests/test_keras_skwrap_digits.py tests/test_keras_wrapper_stress.py
          tests/test_framework_integration.py tests/test_keras_inner_validation.py
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with docs extra
        run: python -m pip install -e ".[docs]" pytest

      - name: Build site (strict) and test docs
        run: >
          python -m pytest -q -o addopts="-ra -q --strict-markers"
          tests/test_docs_build.py tests/test_docs_snippets.py
