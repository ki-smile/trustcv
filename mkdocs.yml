site_name: trustcv
site_description: Trustworthy cross-validation for medical and regulated machine learning
site_url: https://ki-smile.github.io/trustcv/
repo_url: https://github.com/ki-smile/trustcv
repo_name: ki-smile/trustcv
edit_uri: edit/main/docs/
copyright: Developed at SMAILE, Karolinska Institutet · MIT License

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/css/trustcv.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

exclude_docs: |
  maintainers/
  LEAKAGE_DETECTION_IMPLEMENTATION.md
  README.md
  /*.md
  !/index.md

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

plugins:
  - search

nav:
  - Home: index.md
