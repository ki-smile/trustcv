site_name: trustcv
site_description: Trustworthy cross-validation for medical and regulated machine learning
site_url: https://ki-smile.github.io/trustcv/
repo_url: https://github.com/ki-smile/trustcv
repo_name: ki-smile/trustcv
edit_uri: edit/main/docs/
copyright: Developed at SMAILE, Karolinska Institutet · MIT License

docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/css/trustcv.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

exclude_docs: |
  maintainers/
  LEAKAGE_DETECTION_IMPLEMENTATION.md
  README.md
  /*.md
  !/index.md

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

hooks:
  - docs/hooks/schema.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            allow_inspection: false
            docstring_style: numpy
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 3
  - llmstxt:
      markdown_description: >-
        trustcv is a Python toolkit for trustworthy cross-validation in medical
        and regulated machine learning: leakage-aware splitters, integrity
        checks with an overall status (PASSED, NEEDS_REVIEW, NOT_FULLY_VERIFIED,
        FAILED), corrected confidence intervals and documentation support.
      full_output: llms-full.txt
      sections:
        Get started:
          - index.md
          - get-started/*.md
        Guides:
          - guides/*.md
        Regulatory:
          - regulatory/documentation-guide.md
        Reference:
          - reference/api.md
          - reference/ai-agents.md
          - reference/changelog.md

nav:
  - Home: index.md
  - Get started:
      - Install: get-started/install.md
      - Quickstart: get-started/quickstart.md
      - Reading results: get-started/reading-results.md
      - Command line and examples: get-started/cli.md
  - Guides:
      - Choosing a split: guides/choosing-cv.md
      - Data leakage: guides/data-leakage.md
      - Best practices: guides/best-practices.md
      - Deep learning: guides/deep-learning.md
      - Confidence intervals: guides/confidence-intervals.md
      - Compared with other toolkits: guides/methods-comparison.md
  - Learn:
      - Interactive visualisations: learn/visualisations.md
      - Tutorials: learn/tutorials.md
      - Quiz: learn/quiz.md
      - Notebooks: learn/notebooks.md
  - Regulatory:
      - Documenting validation: regulatory/documentation-guide.md
      - Report draft tool: regulatory/report-draft.md
  - Reference:
      - API: reference/api.md
      - For AI agents: reference/ai-agents.md
      - Changelog: reference/changelog.md
      - License: reference/license.md
